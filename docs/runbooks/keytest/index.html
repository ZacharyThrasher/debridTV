<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DebridTV remote key test</title>
<style>
  body { background: #111; color: #eee; font: 2.2vw/1.4 system-ui, sans-serif; margin: 4vh 4vw; }
  h1 { font-size: 3vw; margin: 0 0 2vh; }
  #env { color: #9cf; margin-bottom: 2vh; word-break: break-all; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid #333; padding: .4vh 1vw; text-align: left; }
</style>
<h1>Press each remote button once: arrows, OK, Back, colour keys, Info, Guide, CH+/CH−, Play/Pause.</h1>
<div id="env"></div>
<table><thead><tr><th>key</th><th>code</th><th>keyCode</th></tr></thead><tbody id="log"></tbody></table>
<script>
  // Shows what the remote sends. Nothing is sent anywhere; it only draws on this page.
  const tvMode = matchMedia("(hover: none) and (pointer: none)").matches && innerWidth >= 960;
  document.getElementById("env").textContent =
    "User agent: " + navigator.userAgent + " | no-pointer screen ≥960px: " + (tvMode ? "yes" : "no") + " | width " + innerWidth;
  addEventListener("keydown", (e) => {
    e.preventDefault();
    const row = document.createElement("tr");
    for (const v of [e.key, e.code, e.keyCode]) { const td = document.createElement("td"); td.textContent = String(v); row.append(td); }
    document.getElementById("log").prepend(row);
  });
</script>
