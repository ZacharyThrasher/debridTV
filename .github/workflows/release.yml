# Builds DebridTV.exe, starts it on a real Windows machine (including the
# automatic ffmpeg download), and only then makes the GitHub release.
#   Run it from Actions → Release → Run workflow (tick "publish" to publish right
#   away; otherwise it's a draft), or push a tag like v0.1.0 for a draft.
#   Pull requests run the build and Windows check only.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release now (unticked: save it as a draft)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  # Pull requests that touch the app or packaging get the Windows check, no release.
  pull_request:
    paths: ["app/**", "src/**", "scripts/**", "packaging/**", "desktop/**", "test/desktop/**", "package*.json", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  # DebridTV's own window (desktop/): Rust, built on Windows, packed into DebridTV.exe.
  window:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: window-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Build debridtv-window.exe
        working-directory: desktop
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: debridtv-window
          path: desktop/target/release/debridtv-window.exe
          if-no-files-found: error

  build:
    needs: window
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - run: npm ci
      - run: npm run typecheck
      - run: node --test test/ffmpeg-fetch.test.ts
      - uses: actions/download-artifact@v4
        with:
          name: debridtv-window
          path: dist
      - run: npm run build:exe
        env:
          DEBRIDTV_REQUIRE_WINDOW: "1"
      - id: v
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: debridtv-windows
          path: |
            dist/DebridTV.exe
            dist/DebridTV-v*-win-x64.zip
          if-no-files-found: error

  windows-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: debridtv-windows
      - uses: actions/download-artifact@v4
        with:
          name: debridtv-window
          path: window
      - name: Start DebridTV.exe like a first-time user
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -Path (Get-Item "DebridTV-v*-win-x64.zip").FullName -DestinationPath unzipped
          $env:DEBRIDTV_HOME = "$env:RUNNER_TEMP\dtv-home"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\dtv-local"
          # Act like a PC without ffmpeg, so the automatic download is what's tested.
          $env:DEBRIDTV_IGNORE_PATH_FFMPEG = "1"
          $exe = "unzipped\DebridTV\DebridTV.exe"
          # An older copy (like `npm start` from a checkout) already holds the port: the exe must
          # replace it, so the loop below waits for an answer that carries this build.
          Set-Content old.js 'require("http").createServer((q, r) => r.end(JSON.stringify({ channels: [], version: "0.0.9" }))).listen(7337, "127.0.0.1")'
          $old = Start-Process node -ArgumentList (Resolve-Path old.js).Path -PassThru -RedirectStandardError old.err
          $oldUp = $false
          for ($i = 0; $i -lt 30 -and -not $oldUp; $i++) {
            try { $o = Invoke-RestMethod "http://127.0.0.1:7337/api/bootstrap"; $oldUp = ($o.version -eq "0.0.9") } catch { Start-Sleep 1 }
          }
          if (-not $oldUp) { Get-Content old.err; throw "the stand-in older copy didn't start" }
          $p = Start-Process $exe -ArgumentList "--no-browser" -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          $base = "http://127.0.0.1:7337"
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { $b = Invoke-RestMethod "$base/api/bootstrap"; if ($b.build) { $up = $true } else { Start-Sleep 1 } } catch { Start-Sleep 1 }
          }
          if (-not $up) { Get-Content out.log, err.log; throw "DebridTV didn't start, or didn't replace the older copy on the port" }
          Write-Host "Started: version $($b.version), build $($b.build), demo $($b.demo), $($b.channels.Count) channels"
          if (-not (Select-String -Path out.log -Pattern "Closing it so this one can start" -Quiet)) { Get-Content out.log; throw "the exe didn't say it replaced the older copy" }
          $page = Invoke-WebRequest "$base/" -UseBasicParsing
          if ($page.Content -notmatch "DebridTV") { throw "the guide page didn't load" }
          Invoke-WebRequest "$base/styles.css" -UseBasicParsing | Out-Null
          Invoke-WebRequest "$base/lan" -UseBasicParsing | Out-Null
          # A second double-click must reopen, not fail.
          $second = Start-Process $exe -ArgumentList "--no-browser" -PassThru -Wait -RedirectStandardOutput second.log
          if ($second.ExitCode -ne 0) { Get-Content second.log; throw "second start failed" }
          Get-Content second.log
          # Compatibility mode turns itself on once ffmpeg is downloaded.
          $ready = $false
          for ($i = 0; $i -lt 120 -and -not $ready; $i++) {
            $s = Invoke-RestMethod "$base/api/sources"
            if ($s.ffmpeg) { $ready = $true } elseif ($s.ffmpegFetch.state -eq "failed") { break } else { Start-Sleep 5 }
          }
          Stop-Process -Id $p.Id
          Get-Content out.log
          if (-not $ready) { Get-Content err.log; throw "ffmpeg wasn't set up: $($s.ffmpegFetch | ConvertTo-Json)" }
          $ff = "$env:LOCALAPPDATA\DebridTV\ffmpeg\bin\ffmpeg.exe"
          $enc = & $ff -hide_banner -encoders
          foreach ($e in "libx264", "libopus", " aac ") { if (-not ($enc -match $e)) { throw "downloaded ffmpeg lacks $e" } }
          Write-Host "Windows check passed: starts, serves the guide, reopens, and sets up ffmpeg."
      - name: Open DebridTV's window like a first-time user (downloads mpv)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:DEBRIDTV_HOME = "$env:RUNNER_TEMP\dtv-home"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\dtv-local"
          $env:DEBRIDTV_IGNORE_PATH_FFMPEG = "1"
          $p = Start-Process "unzipped\DebridTV\DebridTV.exe" -PassThru -RedirectStandardOutput win.log -RedirectStandardError win.err
          $mpv = "$env:LOCALAPPDATA\DebridTV\mpv\0.41.0\mpv.exe"
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 2
            $ok = (Test-Path $mpv) -and (Get-Process debridtv-window -ErrorAction SilentlyContinue) -and (Get-Process mpv -ErrorAction SilentlyContinue)
          }
          Get-Content win.log
          if (-not $ok) { Get-Content win.err; Get-Process | Where-Object { $_.Name -match "debridtv|mpv" } | Format-Table Name, Id; throw "the window with mpv didn't open" }
          & $mpv --version | Select-Object -First 1
          Get-Process debridtv-window, mpv | Format-Table Name, Id, StartTime
          Stop-Process -Name debridtv-window
          Start-Sleep 2
          if (Get-Process mpv -ErrorAction SilentlyContinue) { throw "mpv kept running after the window closed" }
          Stop-Process -Id $p.Id
          Write-Host "The exe downloaded mpv, opened its window, and mpv closed with it."
      - name: Play DTS in the window, under the page
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $local = "$env:RUNNER_TEMP\dtv-local"
          $ff = "$local\DebridTV\ffmpeg\bin\ffmpeg.exe"
          $mpv = "$local\DebridTV\mpv\0.41.0\mpv.exe"
          & $ff -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=1280x720:rate=24:duration=30" -f lavfi -i "sine=frequency=440:duration=30" `
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a dca -strict -2 -ac 2 -ar 48000 -b:a 768k dts.mkv
          $report = "$env:RUNNER_TEMP\report.json"
          $srv = Start-Process node -ArgumentList "src\test\desktop\serve.mjs", "7444", (Resolve-Path dts.mkv).Path, $report -PassThru -RedirectStandardOutput srv.log -RedirectStandardError srv.err
          Start-Sleep 2
          # No sound card on the runner: mpv still decodes, into a null output.
          $env:DEBRIDTV_MPV_ARGS = "--ao=null"
          $w = Start-Process "window\debridtv-window.exe" -ArgumentList "--url", "http://127.0.0.1:7444/", "--mpv", $mpv, "--data", "$env:RUNNER_TEMP\webview", "--trace", "$env:RUNNER_TEMP\trace.log" -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $report); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $report)) { Get-Content "$env:RUNNER_TEMP\trace.log" -ErrorAction SilentlyContinue | Select-Object -First 80; throw "the page never reported" }
          $r = Get-Content $report | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 5
          if (-not $r.ok) { throw "the page says: $($r.why)" }
          if ($r.audioCodec -ne "dts") { throw "mpv isn't decoding DTS: $($r.audioCodec)" }
          if (-not $r.audioParams.samplerate) { throw "no decoded sound" }
          if ($r.path -notmatch "/media/test$") { throw "mpv didn't open the file directly: $($r.path)" }
          if ([math]::Abs($r.timePos - 3 - $r.currentTime) -gt 0.5 -or $r.timePos -lt 4) { throw "positions are off: mpv $($r.timePos), page $($r.currentTime)" }
          # The picture shows through the page; the page's red bar covers the picture.
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type 'using System; using System.Runtime.InteropServices; public class W { [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); }'
          $w.Refresh()
          [W]::SetForegroundWindow($w.MainWindowHandle) | Out-Null
          Start-Sleep 1
          $rect = New-Object W+R
          [W]::GetWindowRect($w.MainWindowHandle, [ref]$rect) | Out-Null
          $bmp = New-Object System.Drawing.Bitmap ([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width), ([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen(0, 0, 0, 0, $bmp.Size)
          $bmp.Save("$env:RUNNER_TEMP\window.png")
          function Avg($x0, $y0) { $s = 0; $n = 0; $red = 0; for ($x = $x0 - 10; $x -lt $x0 + 10; $x += 2) { for ($y = $y0 - 10; $y -lt $y0 + 10; $y += 2) { $c = $bmp.GetPixel($x, $y); $s += ($c.R + $c.G + $c.B) / 3; $red += $c.R - ($c.G + $c.B) / 2; $n++ } }; [pscustomobject]@{ bright = $s / $n; red = $red / $n } }
          $cx = [int](($rect.L + $rect.Rt) / 2)
          $top = Avg $cx ([int]($rect.T + ($rect.B - $rect.T) * 0.35))
          $bar = Avg $cx ([int]($rect.B - ($rect.B - $rect.T) * 0.08))
          Write-Host "window $($rect.L),$($rect.T)-$($rect.Rt),$($rect.B); picture area $($top | ConvertTo-Json -Compress); bar $($bar | ConvertTo-Json -Compress)"
          Stop-Process -Id $w.Id, $srv.Id -ErrorAction SilentlyContinue
          if ($bar.red -lt 80) { throw "the page isn't on top of the picture" }
          if ($top.bright -lt 25) { throw "the picture doesn't show through the page" }
          Write-Host "Window check passed: DTS plays in mpv, the picture shows through the page, the page draws on top."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-check
          path: |
            ${{ runner.temp }}/window.png
            ${{ runner.temp }}/trace.log
            ${{ runner.temp }}/report.json
          if-no-files-found: ignore

  release:
    if: github.event_name != 'pull_request'
    needs: [build, windows-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debridtv-windows
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          tag="v$VERSION"
          zip="dist/DebridTV-v$VERSION-win-x64.zip"
          (cd dist && sha256sum DebridTV.exe "DebridTV-v$VERSION-win-x64.zip" > SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/DebridTV.exe "$zip" dist/SHA256SUMS.txt --clobber
            gh release edit "$tag" --notes-file "docs/releases/$tag.md"
          else
            gh release create "$tag" dist/DebridTV.exe "$zip" dist/SHA256SUMS.txt \
              --title "DebridTV $VERSION" --notes-file "docs/releases/$tag.md" --target "$GITHUB_SHA" --draft
          fi
          if [ "$PUBLISH" = "true" ]; then gh release edit "$tag" --draft=false --latest; fi
          gh release view "$tag" --json url,isDraft
