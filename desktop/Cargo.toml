[package]
name = "debridtv-window"
version = "0.1.0"
edition = "2021"
description = "DebridTV's app window on Windows: the guide in WebView2 over mpv"
license = "MIT"
publish = false

[[bin]]
name = "debridtv-window"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = "0.37"
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
